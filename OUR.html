<tmp.core mode="transfer">

    <take>
        <user>OUR.tmp</user>
        <prefetch>prefetch.inner.lock</prefetch>
    </take>

    <bind>
        <edy>EDY.link()</edy>
        <mana>MANA.level</mana>
        <evo>EVO.HALL.shift()</evo>
    </bind>

    <score>
        <valid>OUR.tmp</valid>
        <level>MANA.level</level>
        <axis>x0 y0 z0</axis>
    </score>

    <wette>
        <path>2in1 | 1zu2</path>
        <choose>EDY.route()</choose>
    </wette>

    <slide>
        <shift>xU yU zU</shift>
        <smooth>EVO.HALL.flow()</smooth>
    </slide>

    <pass>
        <use>USE.point</use>
        <coord>xU yU zU</coord>
        <universe>UNI.x UNI.y UNI.z</universe>
    </pass>

</tmp.core>
