<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RESPO — QI / IQQ</title>

<style>
    body {
        margin: 0;
        background: #000;
        color: #66ccff;
        font-family: monospace;
        text-align: center;
        padding-top: 12vh;
        letter-spacing: 2px;
    }
</style>

</head>
<body>

<h1>RESPO — QI / IQQ</h1>
<p>Mathematische Lichtpunkte aktiv</p>

<script type="module">
import PIµ from "./PI.js";

const QI   = PIµ.phiScale(PIµ.pi);
const IQQ  = PIµ.muShift(PIµ.vec(1,1));

document.body.innerHTML += "<p>QI: " + QI + "</p>";
document.body.innerHTML += "<p>IQQ: (" + IQQ.a + ", " + IQQ.b + ", " + IQQ.c + ")</p>";
</script>

</body>
