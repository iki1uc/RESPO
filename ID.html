<id core="EDy.respoTMP" layer="7" mode="evo">

    <sign>R7</sign>

    <mana>
        <pulse>MANA.flow()</pulse>
        <hold>MANA.keep</hold>
        <rise>MANA.level++</rise>
    </mana>

    <evohall>
        <room>EVO.HALL</room>
        <axis>x7 y7 z7</axis>
        <shift>evo.move()</shift>
    </evohall>

    <respo>
        <in>USER.tmp</in>
        <out>USE.point</out>
        <echo>EDY.reply()</echo>
    </respo>

</id>
